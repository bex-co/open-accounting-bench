[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-accounting-bench"
version = "0.2.0"
description = "Open, living, executable benchmark for AI accounting agents (Harbor task format, Beancount ledgers)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Open Accounting Bench contributors" }]
keywords = ["benchmark", "accounting", "beancount", "harbor", "agents", "evaluation"]
dependencies = []

[project.scripts]
oab = "oab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/oab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
